Transform: AWS::Serverless-2016-10-31

Parameters:
  Stage:
    Type: String
  TextModelId:
    Type: String
  MantleBaseUrl:
    Type: String

Globals:
  Function:
    Runtime: python3.12
    Handler: app.lambda_handler
    MemorySize: 512
    Timeout: 30
    Environment:
      Variables:
        STAGE: !Ref Stage
        DATA_BUCKET: { 'Fn::ImportValue': !Sub 'lecdoc-${Stage}-DataBucketName' }
        TEXT_MODEL_ID: !Ref TextModelId
        MANTLE_BASE_URL: !Ref MantleBaseUrl
        BEDROCK_KEY_PARAM: !Sub '/lecdoc/${Stage}/bedrock-api-key'
        AWS_S3_US_EAST_1_REGIONAL_ENDPOINT: regional

Resources:
  ChunkFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lecdoc-${Stage}-chunk'
      CodeUri: src/chunk/
      Policies:
        - S3CrudPolicy:
            BucketName: { 'Fn::ImportValue': !Sub 'lecdoc-${Stage}-DataBucketName' }

  SummarizeFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lecdoc-${Stage}-summarize'
      CodeUri: src/summarize/
      Policies:
        - S3CrudPolicy:
            BucketName: { 'Fn::ImportValue': !Sub 'lecdoc-${Stage}-DataBucketName' }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lecdoc/${Stage}/bedrock-api-key'

  IndexFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lecdoc-${Stage}-index'
      CodeUri: src/index/
      Policies:
        - S3CrudPolicy:
            BucketName: { 'Fn::ImportValue': !Sub 'lecdoc-${Stage}-DataBucketName' }

  QaFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lecdoc-${Stage}-qa'
      CodeUri: src/qa/
      Policies:
        - S3CrudPolicy:
            BucketName: { 'Fn::ImportValue': !Sub 'lecdoc-${Stage}-DataBucketName' }
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lecdoc/${Stage}/bedrock-api-key'

  SpeakFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'lecdoc-${Stage}-speak'
      CodeUri: src/speak/
      Policies:
        - S3CrudPolicy:
            BucketName: { 'Fn::ImportValue': !Sub 'lecdoc-${Stage}-DataBucketName' }
        - Statement:
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: '*'

Outputs:
  ChunkFnArn:
    Value: !GetAtt ChunkFn.Arn
    Export: { Name: !Sub 'lecdoc-${Stage}-ChunkFnArn' }
  SummarizeFnArn:
    Value: !GetAtt SummarizeFn.Arn
    Export: { Name: !Sub 'lecdoc-${Stage}-SummarizeFnArn' }
  IndexFnArn:
    Value: !GetAtt IndexFn.Arn
    Export: { Name: !Sub 'lecdoc-${Stage}-IndexFnArn' }
  QaFnArn:
    Value: !GetAtt QaFn.Arn
    Export: { Name: !Sub 'lecdoc-${Stage}-QaFnArn' }
  SpeakFnArn:
    Value: !GetAtt SpeakFn.Arn
    Export: { Name: !Sub 'lecdoc-${Stage}-SpeakFnArn' }
