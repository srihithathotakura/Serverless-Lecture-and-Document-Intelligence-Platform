AWSTemplateFormatVersion: '2010-09-09'
Description: lecdoc auth - Cognito user pool and web client

Parameters:
  Stage:
    Type: String

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub lecdoc-${Stage}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub lecdoc-${Stage}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub 'lecdoc-${Stage}-UserPoolId'

  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub 'lecdoc-${Stage}-UserPoolArn'

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub 'lecdoc-${Stage}-UserPoolClientId'
