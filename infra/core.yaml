AWSTemplateFormatVersion: '2010-09-09'
Description: lecdoc core - data bucket, documents table, alert topic

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, demo]
  AlertEmail:
    Type: String

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub lecdoc-${Stage}-data-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-data
            Status: Enabled
            ExpirationInDays: 60

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub '${DataBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub lecdoc-${Stage}-documents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: documentId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: documentId, KeyType: RANGE }
      SSESpecification:
        SSEEnabled: true

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub lecdoc-${Stage}-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

Outputs:
  DataBucketName:
    Value: !Ref DataBucket
    Export: { Name: !Sub 'lecdoc-${Stage}-DataBucketName' }
  DataBucketArn:
    Value: !GetAtt DataBucket.Arn
    Export: { Name: !Sub 'lecdoc-${Stage}-DataBucketArn' }
  DocumentsTableName:
    Value: !Ref DocumentsTable
    Export: { Name: !Sub 'lecdoc-${Stage}-DocumentsTableName' }
  DocumentsTableArn:
    Value: !GetAtt DocumentsTable.Arn
    Export: { Name: !Sub 'lecdoc-${Stage}-DocumentsTableArn' }
  AlertTopicArn:
    Value: !Ref AlertTopic
    Export: { Name: !Sub 'lecdoc-${Stage}-AlertTopicArn' }
